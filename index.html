<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落ち物回避ゲーム - Web画像対応版</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            margin-bottom: 10px;
            width: 400px;
        }
        canvas {
            background-color: #111;
            border: 4px solid #fff;
            display: block;
        }
        .life-heart {
            color: #FF3366;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>LIFE: <span id="lifeDisplay" class="life-heart">❤️❤️❤️</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const lifeDisplay = document.getElementById("lifeDisplay");

    // --- ⚙️ カスタマイズ設定エリア ---
    const MAX_LIFE = 3;
    const OBSTACLE_MIN_SIZE = 35;
    const OBSTACLE_MAX_SIZE = 60;
    
    // 【修正】ネット上のサンプル画像URLに変更（ファイル準備不要！）
    // ※今後GitHubにアップロードした際は、ここを "player.png" 等に戻せば動きます。
    const PLAYER_IMAGE_SRC = "https://picsum.photos";  // 可愛い犬の画像（自機）
    const ENEMY_IMAGE_SRCS = [
        "https://picsum.photos", // ライオン（敵1）
        "https://picsum.photos",  // トラ（敵2）
        "https://picsum.photos"   // コヨーテ（敵3）
    ];
    const HEART_IMAGE_SRC = "https://githubusercontent.com"; // 赤いハート（アイテム）

    const ITEM_SPAWN_RATE = 0.005; // ハートの出現率
    // ---------------------------------

    // ゲームの状態管理
    let score = 0;
    let life = MAX_LIFE;
    let gameOver = false;

    // プレイヤー（自機）のデータ
    const player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 55,
        width: 45,
        height: 45,
        speed: 8,
        color: "#00FFCC",
        isInvincible: false,
        invincibleTimer: 0
    };

    // 障害物とアイテムの配列
    const obstacles =;
    const items =;

    const obstacleSpawnRate = 0.03;
    const obstacleSpeedBase = 3;

    // キー入力
    const keys = { ArrowLeft: false, ArrowRight: false };

    // 画像オブジェクトの準備
    const images = {
        player: new Image(),
        enemies:,
        heart: new Image()
    };

    // 画像の総数と読み込み完了カウンター
    const totalImages = 1 + ENEMY_IMAGE_SRCS.length + 1;
    let loadedImagesCount = 0;

    // 画像が1枚読み込まれるたびに呼ばれる関数
    function onImageLoad() {
        loadedImagesCount++;
        if (loadedImagesCount === totalImages) {
            initGame();
        }
    }

    // 画像読み込みエラー時の処理（エラーが起きても強制スタート）
    function onImageError(src) {
        console.warn(`画像の読み込みに失敗: ${src}`);
        onImageLoad();
    }

    // 画像のプリロード
    function preloadImages() {
        // クロスオリジン（セキュリティ対策）の設定を追加
        images.player.crossOrigin = "anonymous";
        images.player.src = PLAYER_IMAGE_SRC;
        images.player.onload = onImageLoad;
        images.player.onerror = () => onImageError(PLAYER_IMAGE_SRC);

        ENEMY_IMAGE_SRCS.forEach((src) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = src;
            img.onload = onImageLoad;
            img.onerror = () => onImageError(src);
            images.enemies.push(img);
        });

        images.heart.crossOrigin = "anonymous";
        images.heart.src = HEART_IMAGE_SRC;
        images.heart.onload = onImageLoad;
        images.heart.onerror = () => onImageError(HEART_IMAGE_SRC);
    }

    // キーボード操作の登録
    window.addEventListener("keydown", (e) => {
        if (e.key in keys) keys[e.key] = true;
        if (gameOver && e.key === " ") restartGame();
    });

    window.addEventListener("keyup", (e) => {
        if (e.key in keys) keys[e.key] = false;
    });

    // 障害物の生成
    function spawnObstacle() {
        if (Math.random() < obstacleSpawnRate) {
            const size = Math.random() * (OBSTACLE_MAX_SIZE - OBSTACLE_MIN_SIZE) + OBSTACLE_MIN_SIZE;
            const randomIndex = Math.floor(Math.random() * images.enemies.length);
            const chosenImage = images.enemies[randomIndex];

            obstacles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: obstacleSpeedBase + Math.random() * 3 + (score * 0.1),
                image: chosenImage,
                color: "#FF3366"
            });
        }
    }

    // ハートアイテムの生成
    function spawnItem() {
        if (Math.random() < ITEM_SPAWN_RATE) {
            const size = 30;
            items.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: 3,
                image: images.heart,
                color: "#FF55AA"
            });
        }
    }

    // 衝突判定
    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    function updateLifeDisplay() {
        lifeDisplay.textContent = "❤️".repeat(Math.max(0, life));
    }

    // ゲームの更新
    function update() {
        if (gameOver) return;

        if (keys.ArrowLeft && player.x > 0) {
            player.x -= player.speed;
        }
        if (keys.ArrowRight && player.x < canvas.width - player.width) {
            player.x += player.speed;
        }

        if (player.isInvincible) {
            player.invincibleTimer--;
            if (player.invincibleTimer <= 0) {
                player.isInvincible = false;
            }
        }

        spawnObstacle();
        spawnItem();

        // 障害物の処理
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.y += obs.speed;

            if (!player.isInvincible && checkCollision(player, obs)) {
                life--;
                updateLifeDisplay();
                obstacles.splice(i, 1);

                if (life <= 0) {
                    gameOver = true;
                } else {
                    player.isInvincible = true;
                    player.invincibleTimer = 60;
                }
                continue;
            }

            if (obs.y > canvas.height) {
                obstacles.splice(i, 1);
                score += 10;
                scoreElement.textContent = score;
            }
        }

        // ハートの処理
        for (let i = items.length - 1; i >= 0; i--) {
            const item = items[i];
            item.y += item.speed;

            if (checkCollision(player, item)) {
                if (life < MAX_LIFE) {
                    life++;
                    updateLifeDisplay();
                } else {
                    score += 50;
                    scoreElement.textContent = score;
                }
                items.splice(i, 1);
                continue;
            }

            if (item.y > canvas.height) {
                items.splice(i, 1);
            }
        }
    }

    // 画面の描画
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. プレイヤー（自分）の描画
        if (!player.isInvincible || Math.floor(player.invincibleTimer / 5) % 2 === 0) {
            if (images.player.complete && images.player.naturalWidth > 0) {
                ctx.drawImage(images.player, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        // 2. 敵（障害物）の描画
        for (const obs of obstacles) {
            if (obs.image && obs.image.complete && obs.image.naturalWidth > 0) {
                ctx.drawImage(obs.image, obs.x, obs.y, obs.width, obs.height);
            } else {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
        }

        // 3. ハートの描画
        for (const item of items) {
            if (item.image && item.image.complete && item.image.naturalWidth > 0) {
                ctx.drawImage(item.image, item.x, item.y, item.width, item.height);
            } else {
                ctx.fillStyle = item.color;
                ctx.fillRect(item.x, item.y, item.width, item.height);
            }
        }

        // 4. ゲームオーバー画面
        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "18px sans-serif";
            ctx.fillText("スペースキーでリスタート", canvas.width / 2, canvas.height / 2 + 20);
        }
    }

    // ループ処理
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // 初回ゲーム初期化
    function initGame() {
        updateLifeDisplay();
        gameLoop();
    }

    // リスタート
    function restartGame() {
        score = 0;
        life = MAX_LIFE;
        scoreElement.textContent = score;
        updateLifeDisplay();
        obstacles.length = 0;
