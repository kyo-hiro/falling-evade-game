<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おみくじゲーム</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
        }

        .game-container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #d9534f;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* おみくじの箱（画像エリア） */
        .omikuji-box {
            width: 150px;
            height: 200px;
            background-color: #e6a15c;
            border: 4px solid #b57432;
            border-radius: 10px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        /* 箱の飾り線 */
        .omikuji-box::before {
            content: "サンプルおみくじ";
            writing-mode: vertical-rl;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #d9534f;
            padding: 10px 5px;
            border-radius: 5px;
            letter-spacing: 4px;
        }

        /* シャカシャカ揺れるアニメーション */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 0) rotate(-10deg); }
            40% { transform: translate(10px, 0) rotate(10deg); }
            60% { transform: translate(-10px, 0) rotate(-10deg); }
            80% { transform: translate(10px, 0) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shaking {
            animation: shake 0.5s ease-in-out infinite;
        }

        /* ボタン */
        .draw-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
            transition: all 0.2s;
        }

        .draw-btn:hover {
            background-color: #c9302c;
            transform: translateY(-2px);
        }

        .draw-btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 結果発表モーダル */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .result-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 300px;
            width: 80%;
            border: 8px double #d9534f;
        }

        .result-overlay.show .result-card {
            transform: scale(1);
        }

        .result-unsei {
            font-size: 48px;
            font-weight: bold;
            color: #d9534f;
            margin: 20px 0;
        }

        .result-text {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .close-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>✨ サンプルおみくじ ✨</h1>
    <div id="omikujiBox" class="omikuji-box"></div>
    <button id="drawBtn" class="draw-btn" onclick="drawOmikuji()">おみくじを引く</button>
</div>

<div id="resultOverlay" class="result-overlay">
    <div class="result-card">
        <h2>あなたの運勢は…</h2>
        <div id="resultUnsei" class="result-unsei">大吉</div>
        <p id="resultText" class="result-text">素晴らしい一日になります！</p>
        <button class="close-btn" onclick="closeResult()">もう一度引く</button>
    </div>
</div>

<script>
    // おみくじのデータと「確率（あわせて1.0になるように設定）」
    const omikujiResults = [
        { unsei: "🎉大吉", weight: 0.05, text: "最高の一日！〇〇です。また嬉しいことがあるかも？" },
        { unsei: "✨吉",   weight: 0.10, text: "とても良い運気です。〇〇です。謙虚な気持ちで過ごすとさらに吉。" },
        { unsei: "👍中吉", weight: 0.15, text: "安定した良い運勢です。〇〇です。欲張らず目の前のことを大切に。" },
        { unsei: "🍀小吉", weight: 0.20, text: "ささやかな幸せが訪れる予感。〇〇です。良い発見があるかも。" },
        { unsei: "💤末吉", weight: 0.50, text: "〇〇です！これからの行動次第でどんどん運気が上がります。" }
    ];

    const box = document.getElementById("omikujiBox");
    const btn = document.getElementById("drawBtn");
    const overlay = document.getElementById("resultOverlay");
    const resultUnsei = document.getElementById("resultUnsei");
    const resultText = document.getElementById("resultText");

    function drawOmikuji() {
        btn.disabled = true;
        box.classList.add("shaking");

        setTimeout(() => {
            box.classList.remove("shaking");

            // ---確率に基づいたランダム抽選ロジック ---
            const random = Math.random(); // 0以上1未満のランダムな数字
            let cumulativeWeight = 0;    // 確率を積み上げていく変数
            let selectedResult = omikujiResults[omikujiResults.length - 1]; // 万が一のための初期値（末吉）

            for (const result of omikujiResults) {
                cumulativeWeight += result.weight; // 確率を足す
                if (random < cumulativeWeight) {   // 境界線を超えたら当選！
                    selectedResult = result;
                    break;                         // ループを抜ける
                }
            }
            // --------------------------------------------

            // 画面に選ばれた結果をセット
            resultUnsei.textContent = selectedResult.unsei;
            resultText.textContent = selectedResult.text;

            overlay.classList.add("show");
        }, 1000);
    }

    function closeResult() {
        overlay.classList.remove("show");
        btn.disabled = false;
    }
</script>

</body>
</html>
